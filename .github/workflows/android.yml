name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Fix SDK location
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
